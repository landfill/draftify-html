# PR-Agent 프로젝트 특화 설정 (Gemini 도입과 함께 신규, 2026-07-16)
#
# PR-Agent가 이 워크플로에서 실행 중인 경우, 리포지토리 루트의 이 파일이 기본 동작을 재정의합니다.
# 워크플로 환경 변수와 충돌하는 키가 없을 때만 여기 값이 적용됩니다 (PR-Agent 우선순위 규칙).
# 주 모델(config.model)은 yml에서 이미 지정(gemini-3.5-flash). 여기서는 작업별 분배와 리뷰 품질 튜닝.
#
# 원칙 근거: docs/PRD.md §1.3(제1원칙 4종) · AGENTS.md §6(브랜치·규약)
# 이 프로젝트의 정체성 — "목업 무수정", "캡처는 클라이언트에서만", "산출물은 단독 HTML·네트워크 0건"

[config]
# 주 모델은 yml의 config.model(gemini-3.5-flash)이 우선. 여기엔 가벼운 작업용 모델만.
# model_weak: /describe, /ask, 라인 질문, changelog — 가벼운 작업이라 비용 효율형 3.1 Flash-Lite 사용.
#   (지정 안 하면 주 모델을 그대로 씁니다 — 비용 3.5 Flash로 치러짐)
# model_reasoning: /improve 자기반성 단계. 3.5 Flash가 충분히 강해 미설정(주 모델 재사용).
model_weak = "gemini/gemini-3.1-flash-lite"

[pr_reviewer]
# 리뷰 카테고리는 PR-Agent 기본을 따르되, 이 프로젝트의 정체성 위반을 최우선으로 검출.
# 어절 차원의 가이드라인을 주면 Gemini가 각 발견에 우선순위를 둡니다.
extra_instructions = """
이 프로젝트는 Mockup-as-Spec. 4가지 설계 제1원칙(PRD §1.3) 위반을 최우선 검출하라:
1. 의도는 사람이 입력해야 한다 — LLM 추론·크롤링으로 채우는 코드 경로가 추가되면 반드시 지적.
   LLM 초안 제안은 옵트인이어야 하고 기본 OFF여야 한다(POL-M13).
2. SDK 주입만 서비스가 한다 — 사용자가 목업 소스에 data-spec-id 같은 속성을 넣게 하는 코드·문서는 금지.
3. 캡처는 클라이언트 브라우저에서만 — 서버 헤드리스(puppeteer·playwright)로 캡처 재현하는 경로는 절대 허용하지 않는다.
4. 산출물은 단독 HTML·네트워크 0건 — 산출물 HTML이 외부 스크립트·폰트·이미지 URL·fetch를 포함하면 즉시 지적.
   파일://로 열렸을 때 Network 탭 0건이 어겨지는지 코드 레벨에서 확인.

그 외 강조사항:
- 앵커는 selector+text+attrs 다중 시그니처가 1순위. data-spec-id가 1순위로 섞이면 안 됨(ID-06/07).
- 어노테이션 번호는 중간 결번 유지 + 신규는 현재 최대+1. 재정렬·재번호 부여 코드는 경고.
- SSRF: allowlist(env) + hard-deny IP + DNS resolve IP 고정 연결 세 겹. 한 겹이라도 빠지면 심각.
  사설 대역(10/172.16/192.168)은 hard-deny 대상이 아님 — 의도적 예외(사내 스테이징).
- 산출물의 <script> 0개 검증은 이중 방어. 완화하거나 예외 케이스를 만드는 PR은 반드시 표시하라.
- 에이전트 규약: main 직접 커밋·불필요 병합·브랜치 접두 위배(fix/feat/docs/chore)도 위반으로 본다(AGENTS.md §6).
- 한국어 산출물·문자열. 사용자 표면 용어는 "화면"/"화면 이동"(구 "장면"/"전이"). 코드 식별자는 그대로 유지.
"""

[pr_description]
# /describe 결과물을 우리 문서 체계 언어로. PR 제목·본문이 영어면 한국어로 번역하지 말 것(코드 컨벤션 존중).
extra_instructions = """
PR 설명은 한국어보다 코드 컨벤션 우선. 변경 성격(fix/feat/docs/chore)이 접두에 왔는지 확인하라.
산출물이 docs/PROGRESS.md 세션 로그인 PR이면 종료 시 갱신 여부를 체크리스트에 포함시켜라(AGENTS.md §3).
"""

[pr_code_suggestions]
# Gemini는 가끔 너무 많은 제안을 냅니다. 임계치를 높이고 "정말 중요한" 제안만 남깁니다.
num_code_suggestions = 4
# 점수 문턱(0~10). 7 이상만 제안 — 노이즈 절감(Gemini가 자잘한 스타일을 자꾸 제안하는 경향 대응)
suggestions_score_threshold = 7

# 보안은 /review 안에 자동 포함되지만, /improve에서도 보안 항목이 묻히지 않게 우선순위 끌어올리기
extra_instructions = "보안(SSRF, zip-slip, 토큰 처리, 인증 게이트)·검증(countScripts, 네트워크 0건)·규약 준수를 일반 스타일보다 우선시하라."
