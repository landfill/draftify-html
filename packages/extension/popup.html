<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; width: 340px; margin: 0; padding: 14px; color: #202124; }
    h1 { font-size: 14px; margin: 0 0 4px; }
    .origin { font-size: 12px; color: #5f6368; word-break: break-all; margin-bottom: 12px; }
    label { display: block; font-size: 12px; font-weight: 700; margin: 8px 0 3px; }
    input, textarea { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #dfe3e7; border-radius: 6px; font-size: 13px; font-family: inherit; }
    textarea { resize: vertical; min-height: 54px; }
    .row { display: flex; gap: 8px; margin-top: 12px; }
    button { flex: 1; padding: 7px 0; border-radius: 6px; border: 1px solid #dfe3e7; background: #fff; cursor: pointer; font-weight: 700; font-size: 13px; }
    button.primary { background: #1a73e8; border-color: #1a73e8; color: #fff; }
    button.danger { color: #d93025; }
    .status { font-size: 12px; margin: 10px 0 0; min-height: 16px; }
    .status.ok { color: #188038; }
    .status.error { color: #d93025; }
    .hint { font-size: 11px; color: #5f6368; margin-top: 8px; line-height: 1.5; }
    details { margin-top: 12px; }
    summary { font-size: 12px; color: #5f6368; cursor: pointer; }
    .adv { margin-top: 8px; }
  </style>
</head>
<body>
  <h1>mockspec — 내 화면에서 편집</h1>
  <div class="origin" id="origin">현재 탭 확인 중…</div>

  <label for="code">연결 코드 붙여넣기</label>
  <textarea id="code" placeholder="mockspec:… (콘솔의 [연결 코드 복사]에서 받은 값 하나)"></textarea>
  <div class="row">
    <button id="connect" class="primary" type="button">이 사이트에 연결</button>
    <button id="remove" class="danger" type="button">해제</button>
  </div>
  <p class="hint">콘솔의 [내 화면에서 편집 (확장)] 또는 프로젝트 카드에서 <b>[연결 코드 복사]</b>를
    누르면 프로젝트 ID·토큰·서버 주소가 한 코드로 복사됩니다. 여기에 붙여넣고 [연결]만 누르세요.</p>

  <details>
    <summary>직접 입력 (코드 없이)</summary>
    <div class="adv">
      <label for="project-id">프로젝트 ID (prj_…)</label>
      <input id="project-id" type="text" placeholder="prj_…" autocomplete="off">
      <label for="token">프로젝트 토큰 (tok_…)</label>
      <input id="token" type="password" placeholder="tok_…" autocomplete="off">
      <label for="server-url">서버 주소</label>
      <input id="server-url" type="text" value="http://localhost:3000" autocomplete="off">
      <div class="row"><button id="save" type="button">직접 입력으로 연결</button></div>
    </div>
  </details>

  <p id="status" class="status"></p>

  <script src="popup.js"></script>
</body>
</html>
