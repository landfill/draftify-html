<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!--
    확장 아이콘 원본 (이슈 #68). 헤더 워드마크와 같은 결의 M 모노그램 — 별도 브랜드 자산이
    생기기 전까지의 자리를 채운다. 정식 로고가 나오면 이 파일만 갈아끼우고 render-icons.mjs를
    다시 돌리면 된다.

    글리프를 폰트가 아니라 path로 그리는 이유: 렌더 환경(폰트 유무)에 따라 결과가 달라지면
    아이콘이 재현 가능하지 않다. 획은 stroke 하나로 — 16px로 줄었을 때 형태가 뭉개지지 않는다.
  -->
  <rect width="128" height="128" rx="28" fill="#4f46e5" />
  <path
    d="M34 92 V42 L64 72 L94 42 V92"
    fill="none"
    stroke="#ffffff"
    stroke-width="13"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
